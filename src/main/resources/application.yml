spring:
  application:
    name: spring-webflux-microservice
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # Reactive Postgres via R2DBC
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/webflux}
    username: ${R2DBC_USERNAME:postgres}
    password: ${R2DBC_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  # Reactive MongoDB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/webflux}
      auto-index-creation: true

  # Reactive Redis
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
    timeout: 2000ms

  # Apache Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: webflux-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jvm.gc.pause: true

# JVM / GC tuning — applied via JAVA_OPTS at container start
gc:
  jvm-options: |
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+UseStringDeduplication
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/tmp/heap.hprof
    -XX:+UnlockDiagnosticVMOptions
    -XX:+DebugNonSafepoints
    -Xlog:gc*,gc+heap=info,gc+age=trace,safepoint:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=50m

integrations:
  legacy-http:
    base-url: ${LEGACY_HTTP_BASE_URL:http://localhost:9000}
  soap:
    wsdl-url: ${LEGACY_SOAP_WSDL:}
  sftp:
    host: ${SFTP_HOST:localhost}
    port: ${SFTP_PORT:22}
    user: ${SFTP_USER:dummy}
    private-key-path: ${SFTP_KEY_PATH:/dev/null}

# Application-specific config
app:
  cache:
    orders:
      # ISO-8601 duration: PT5M = 5 minutes, PT1H = 1 hour, PT30S = 30 seconds
      # Override at runtime with: APP_CACHE_ORDERS_TTL=PT10M
      ttl: ${APP_CACHE_ORDERS_TTL:PT5M}
