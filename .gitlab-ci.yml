# GitLab CI — Spring WebFlux microservice
#
# Pipeline stages:
#   1. build    — compile + test + coverage
#   2. package  — fat jar
#   3. docker   — build & push image
#   4. deploy   — rolling update to staging (manual gate to prod)
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   - REGISTRY_USER, REGISTRY_PASSWORD
#   - KUBE_CONFIG (or use agent-based deployment)
#   - SONAR_TOKEN (if using SonarQube)

stages:
  - build
  - package
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  JAVA_VERSION: "21"

# Use the official Eclipse Temurin image as the build base
default:
  image: eclipse-temurin:21-jdk-jammy
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  before_script:
    - apt-get update && apt-get install -y maven

# -------- 1. BUILD + TEST --------
test:
  stage: build
  script:
    - mvn -B -ntp verify -DskipITs
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/site/jacoco
  coverage: '/Total.*?([0-9]{1,3})%/'

# -------- 2. PACKAGE (fat jar) --------
package:
  stage: package
  script:
    - mvn -B -ntp package -DskipTests
  artifacts:
    paths:
      - target/*.jar
  needs: ["test"]

# -------- 3. DOCKER BUILD + PUSH --------
docker:build:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
  needs: ["package"]
  only:
    - main
    - tags

# -------- 4. DEPLOY (rolling) — placeholder, customize per cluster --------
deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying $IMAGE_TAG to staging"
    - kubectl set image deployment/webflux-ms webflux-ms=$IMAGE_TAG -n staging
    - kubectl rollout status deployment/webflux-ms -n staging
  environment:
    name: staging
  needs: ["docker:build"]
  only:
    - main
  when: manual
